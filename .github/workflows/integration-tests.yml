name: 'Integration Tests'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v6.0.9

      - name: Release & Assets
        id: create-test-release
        uses: Hs1r1us/Release-AIO@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.sha }}
          release_name: Integration test ${{ github.sha }}
          asset_files: |
            package.json
            package-lock.json
          draft: true
          prerelease: true

      - name: Test action
        uses: ./ # Uses an action in the root directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create-test-release.outputs.id }}
          asset_name: package.json

      - name: Test action wildcard
        uses: ./ # Uses an action in the root directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create-test-release.outputs.id }}
          asset_name: '*.json'

      - name: Delete test release
        if: ${{ always() }}
        uses: flcdrg/delete-release-action@dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create-test-release.outputs.id }}
          # Whether suppress errors or not
          suppress_errors: false
